<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYTODO - Todo List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="merek">
    <div class="logo">&check;</div>
    <span class="namaapp">MYTODO</span>
  </div>

  <nav>
    <a href="#">Dashboard</a>
    <a href="#">Semua Tugas</a>
    <a href="#" class="aktif">Hari Ini</a>
    <a href="#">Mendatang</a>
    <a href="#">Kategori</a>
  </nav>

  <span class="identitas">Halo, Mas Valdi</span>
  <button type="button" id="tomboltema" class="tematoggle">Mode Gelap</button>
</header>

<div class="isi">

  <main>

    <section class="formbaru">
      <h2>Tambah Tugas Baru</h2>
      <form id="formtugas">
        <div class="baris">
          <div>
            <label for="judul">Judul</label>
            <input type="text" id="judul" placeholder="mau ngapain hari ini?">
          </div>
          <div>
            <label for="kategori">Kategori</label>
            <select id="kategori">
              <option>Kampus</option>
              <option>Bisnis</option>
              <option>Pribadi</option>
            </select>
          </div>
        </div>

        <div class="baris">
          <div>
            <label for="tgl">Tanggal</label>
            <input type="date" id="tgl">
          </div>
          <div>
            <label for="prioritas">Prioritas</label>
            <select id="prioritas">
              <option>Rendah</option>
              <option>Sedang</option>
              <option>Tinggi</option>
            </select>
          </div>
        </div>

        <label for="ket">Keterangan</label>
        <textarea id="ket" rows="2" placeholder="catatan kalo ada"></textarea>

        <button type="button" id="tambah">+ Tambah Tugas</button>
      </form>
    </section>

    <h2>Belum Selesai</h2>
    <ul class="daftar" id="belum"></ul>

    <h2>Sudah Selesai</h2>
    <ul class="daftar selesai" id="sudah"></ul>

  </main>

  <aside>
    <h2>Detail Tugas</h2>

    <div class="kotak">
      <label for="j2">Judul</label>
      <input type="text" id="j2" placeholder="pilih Edit di salah satu tugas">

      <label for="status">Status</label>
      <select id="status">
        <option>Belum dikerjakan</option>
        <option>Selesai</option>
      </select>

      <label for="dl">Deadline</label>
      <input type="date" id="dl">

      <label for="ket2">Keterangan</label>
      <textarea id="ket2" rows="4"></textarea>

      <div class="tombol">
        <button type="button" id="simpan">Simpan</button>
        <button type="button" class="hapus" id="hapusdetail">Hapus</button>
      </div>
    </div>

    <div class="kotak ringkasan">
      <h3>Ringkasan</h3>
      <div class="angka">
        <div>
          <span class="besar" id="jumlahtotal">0</span>
          <span class="kecil">Total</span>
        </div>
        <div>
          <span class="besar" id="jumlahselesai">0</span>
          <span class="kecil">Selesai</span>
        </div>
        <div>
          <span class="besar" id="jumlahbelum">0</span>
          <span class="kecil">Belum</span>
        </div>
      </div>
    </div>
  </aside>

</div>

<footer>
  <p>Pemrograman Web A</p>
</footer>

<script src="script.js"></script>

</body>
</html>
